name: Build EPUB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-epub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 3.8.3

      - name: Flatten LaTeX includes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def expand(path, stack=()):
              path = Path(path)
              if path in stack:
                  raise RuntimeError(f"recursive include: {path}")
              text = path.read_text(encoding="utf-8")

              def replace_include(match):
                  included = Path(match.group(1))
                  if included.suffix != ".tex":
                      included = included.with_suffix(".tex")
                  return expand(included, stack + (path,))

              text = re.sub(r"\\include\{([^}]+)\}", replace_include, text)
              text = text.replace(r"\includegraphics{KL10_1979}", r"\includegraphics{KL10_1979.jpg}")
              text = text.replace(r"\includegraphics{stignucius}", r"\includegraphics{stignucius.jpg}")
              return text

          Path("book-expanded.tex").write_text(expand(Path("faif-2.0.tex")), encoding="utf-8")
          PY
          test -s book-expanded.tex

      - name: Build EPUB
        run: |
          pandoc book-expanded.tex \
            --from=latex \
            --to=epub3 \
            --standalone \
            --toc \
            --metadata 'title=Free as in Freedom 2.0: 理查德·斯托曼与自由软件运动' \
            --metadata 'author=萨姆·威廉姆斯；理查德·斯托曼' \
            --resource-path=. \
            --output=free-as-in-freedom-zh-cn.epub
          test -s free-as-in-freedom-zh-cn.epub

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-as-in-freedom-zh-cn-epub
          path: free-as-in-freedom-zh-cn.epub
          if-no-files-found: error
          retention-days: 7
