name: Build EPUB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-epub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 3.8.3

      - name: Prepare Chinese source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def expand(path, stack=()):
              path = Path(path)
              if path in stack:
                  raise RuntimeError(f"recursive include: {path}")
              text = path.read_text(encoding="utf-8")

              def replace_include(match):
                  included = path.parent / match.group(1)
                  if included.suffix != ".tex":
                      included = included.with_suffix(".tex")
                  return expand(included, stack + (path,))

              return re.sub(r"\\include\{([^}]+)\}", replace_include, text)

          text = expand(Path("faif-2.0.tex"))
          text = re.sub(r"\\ifdefined\\eng\b.*?\\fi", "", text, flags=re.S)
          text = re.sub(r"\\ifdefined\\chs\b(.*?)\\fi", r"\1", text, flags=re.S)
          text = re.sub(r"\\chapter\[[^\]]+\]\{", r"\\chapter{", text)
          text = text.replace(r"\includegraphics{KL10_1979}", r"\includegraphics{KL10_1979.jpg}")
          text = text.replace(r"\includegraphics{stignucius}", r"\includegraphics{stignucius.jpg}")
          if r"\ifdefined\eng" in text or r"\ifdefined\chs" in text:
              raise RuntimeError("language conditionals were not fully resolved")
          Path("book-chs.tex").write_text(text, encoding="utf-8")
          PY
          cat > epub.css <<'CSS'
          body {
            font-family: "Noto Serif CJK SC", "Source Han Serif SC", serif;
            line-height: 1.8;
          }
          h1, h2, h3, h4 {
            line-height: 1.35;
          }
          p {
            margin: 0 0 0.8em;
            text-align: justify;
            text-indent: 2em;
          }
          blockquote {
            margin: 1em 1.5em;
          }
          CSS
          test -s book-chs.tex
          test -s epub.css

      - name: Build Chinese EPUB
        run: |
          pandoc book-chs.tex \
            --from=latex \
            --to=epub3 \
            --standalone \
            --toc \
            --css=epub.css \
            --metadata 'title=自由如自由：理查德·斯托曼与自由软件运动' \
            --metadata 'author=萨姆·威廉姆斯；理查德·斯托曼' \
            --metadata 'lang=zh-CN' \
            --resource-path=. \
            --output=free-as-in-freedom-zh-cn.epub
          test -s free-as-in-freedom-zh-cn.epub

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-as-in-freedom-zh-cn-epub
          path: free-as-in-freedom-zh-cn.epub
          if-no-files-found: error
          retention-days: 7
